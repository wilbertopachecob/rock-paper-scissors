<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neobrutalist favicon: thick border, flat colors, no gradients -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="#F8F3E8" stroke="#1C1D22" stroke-width="3"/>

  <!-- Three swatches standing in for rock / paper / scissors -->
  <rect x="6.5" y="10" width="5.5" height="12" rx="2" fill="#6C93EA" stroke="#1C1D22" stroke-width="1.5"/>
  <rect x="13.25" y="10" width="5.5" height="12" rx="2" fill="#EFA6CB" stroke="#1C1D22" stroke-width="1.5"/>
  <rect x="20" y="10" width="5.5" height="12" rx="2" fill="#EFDD7A" stroke="#1C1D22" stroke-width="1.5"/>
</svg>
